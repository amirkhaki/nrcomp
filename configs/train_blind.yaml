# Stage 4: Latent Student Training - Blind Mode (Config A)
stage: train
config_name: blind_a
manifest_path: data/manifest.parquet
latent_store_dir: data/latents
output_dir: checkpoints/blind_a
history_path: reports/training_blind_a_history.csv
plot_path: reports/training_blind_a_curves.png

model:
  config: A  # y_hat only
  in_channels: 320
  width: 256
  num_res_blocks: 6
  lambda_mode: blind
  num_lambdas: 6
  dropout: 0.1

loss:
  smooth_l1_beta: 0.05
  alpha_rank: 0.5
  rank_margin: 0.0

training:
  epochs: 60
  warmup_epochs: 2
  batch_images: 8
  lambdas_per_image: 3
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  precision: bf16
  seed: 42
  num_workers: 4
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0005
