# Stage 4: Latent Student Training - Blind Mode (Config A)
# Artifacts are derived from `config_name` + seed (see nrcomp/runs.py):
#   checkpoints/blind_a_seed{N}/   reports/runs/blind_a_seed{N}/
stage: train
config_name: blind_a
manifest_path: data/manifest.parquet
latent_store_dir: data/latents
target_metric: haarpsi

model:
  config: A  # y_hat only
  in_channels_y: 320
  width: 256
  num_res_blocks: 6
  lambda_mode: blind
  num_lambdas: 6
  dropout: 0.1
  use_mask: true

loss:
  smooth_l1_beta: 0.01   # design.md Section 8
  alpha_rank: 0.5        # L = (1 - alpha) * L_reg + alpha * L_rank
  rank_margin: 0.0

training:
  epochs: 60
  warmup_epochs: 2
  batch_images: 8
  lambdas_per_image: 3
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  precision: bf16
  seed: 42
  num_workers: 0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0005
  min_train_images: 100
  min_val_images: 30
