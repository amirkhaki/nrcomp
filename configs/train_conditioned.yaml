# Stage 4: Latent Student Training - Conditioned Mode (Config A)
stage: train
config_name: conditioned_a
manifest_path: data/manifest.parquet
latent_store_dir: data/latents
target_metric: haarpsi

model:
  config: A  # y_hat only
  in_channels_y: 320
  width: 256
  num_res_blocks: 6
  lambda_mode: conditioned
  num_lambdas: 6
  lambda_embed_dim: 256
  dropout: 0.1
  use_mask: true

loss:
  smooth_l1_beta: 0.01
  alpha_rank: 0.5
  rank_margin: 0.0

training:
  epochs: 60
  warmup_epochs: 2
  batch_images: 8
  lambdas_per_image: 3
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  precision: bf16
  seed: 42
  num_workers: 0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0005
  min_train_images: 100
  min_val_images: 30
