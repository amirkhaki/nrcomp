# Stage 5: Evaluation Configuration
stage: evaluate
manifest_path: data/manifest.parquet
latent_store_dir: data/latents
target_metric: haarpsi

blind_checkpoint: checkpoints/student_blind_a_best.pt
conditioned_checkpoint: checkpoints/student_conditioned_a_best.pt
config_b_checkpoint: checkpoints/student_conditioned_b_best.pt

eval_main_report: reports/eval_main.md
eval_refs_report: reports/eval_refs.md

evaluation:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  logistic_fit_on_val: true
  seed: 42
  experiments:
    - E1_in_distribution
    - E2_cross_content
    - E3_mos_independence
    - E4_second_teacher
    - E5_shortcut_baselines
    - E8_efficiency
