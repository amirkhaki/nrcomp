[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrcomp"
version = "0.1.0"
description = "No-Reference Compression Degradation Predictor from Codec Latents via Proxy Labels"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
